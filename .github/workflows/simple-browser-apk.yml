name: Build NEXUS Tabs APK

on:
  push:
    branches:
      - simple-browser-apk
    paths:
      - "simple-browser-apk/**"
      - ".github/workflows/simple-browser-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simple-browser-apk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Tabs-debug
          path: simple-browser-apk/app/build/outputs/apk/debug/app-debug.apk
